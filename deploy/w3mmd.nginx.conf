# Reference template for the w3mmd nginx vhost on the EC2 cohost. Nothing reads
# this file live — the authoritative copy is /etc/nginx/sites-enabled/w3mmd.conf,
# copied from here. This is the pre-TLS (port 80) block; certbot adds the 443
# listener + redirect in place (see deploy/README.md). Replace SERVER_NAME.
server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME;

    # Replays are uploaded as the request body; nginx's 1m default would turn
    # away ordinary long games with a 413.
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:3050;
        include /etc/nginx/proxy_params;
        # Results stream out as the replay parses; buffering would hold them
        # until the whole parse finishes.
        proxy_buffering off;
        # A large replay fetched from wc3stats can take a while to download.
        proxy_read_timeout 120s;
    }
}
